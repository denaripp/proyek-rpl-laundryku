<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" style="background:#FFFFFF;font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0B192C"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E7490"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0B192C" stroke-width="1.5"/>
    </marker>
    <marker id="impl-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.6"/>
    </marker>
    <marker id="diamond-comp" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="8" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#0B192C"/>
    </marker>
    <marker id="diamond-agg" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="8" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.4"/>
    </marker>
    <marker id="cf-many" viewBox="0 0 14 12" refX="12" refY="6" markerWidth="11" markerHeight="10" orient="auto">
      <path d="M 1 6 L 12 1 M 1 6 L 12 6 M 1 6 L 12 11 M 1 2 L 1 10" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="cf-one" viewBox="0 0 10 12" refX="6" refY="6" markerWidth="8" markerHeight="10" orient="auto">
      <path d="M 4 1 L 4 11 M 8 1 L 8 11" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="cf-zero-one" viewBox="0 0 16 12" refX="12" refY="6" markerWidth="12" markerHeight="10" orient="auto">
      <circle cx="4" cy="6" r="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
      <path d="M 10 1 L 10 11" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
    
  </defs>
  <text x="520" y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#0B192C">Sequence Diagram B — Transaksi Pesanan &amp; Webhook Idempoten Xendit</text><rect x="9" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="75" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:Customer</text><text x="75" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">(Browser)</text><line x1="75" y1="72" x2="75" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><rect x="169" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="235" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:Next.js BFF</text><text x="235" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">(/api/proxy)</text><line x1="235" y1="72" x2="235" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><rect x="339" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="405" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:Order/Payment</text><text x="405" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">&amp; WebhookCtrl</text><line x1="405" y1="72" x2="405" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><rect x="524" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="590" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:OrderService</text><text x="590" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">&amp; XenditService</text><line x1="590" y1="72" x2="590" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><rect x="699" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="765" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:MySQL 8</text><text x="765" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">(orders/payments)</text><line x1="765" y1="72" x2="765" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><rect x="879" y="34" width="132" height="38" rx="6" fill="#0B192C"/><text x="945" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">:Xendit API</text><text x="945" y="64" text-anchor="middle" font-size="8.5" fill="#99F6E4">(QRIS / Invoice)</text><line x1="945" y1="72" x2="945" y2="565" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/><line x1="75" y1="102" x2="235" y2="102" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="63" y="88" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="155" y="98" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">1. Submit checkout /orders</text><line x1="235" y1="132" x2="405" y2="132" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="228" y="118" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="320" y="128" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">2. Forward Origin+Bearer -&gt; OrderCtrl</text><line x1="405" y1="162" x2="590" y2="162" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="405.5" y="148" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="497.5" y="158" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">3. OrderService::createOrder()</text><line x1="590" y1="192" x2="765" y2="192" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="585.5" y="178" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="677.5" y="188" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">4. DB::transaction(orders, items, history)</text><line x1="765" y1="222" x2="235" y2="222" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
      <rect x="408" y="208" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="500" y="218" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">5. 201 Created (order_number)</text><line x1="75" y1="258" x2="235" y2="258" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="63" y="244" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="155" y="254" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">6. Pilih bayar QRIS / VA</text><line x1="235" y1="288" x2="590" y2="288" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="320.5" y="274" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="412.5" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">7. PaymentCtrl -&gt; createQRCode / Invoice</text><line x1="590" y1="318" x2="945" y2="318" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="675.5" y="304" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="767.5" y="314" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">8. POST /qr_codes atau /v2/invoices</text><line x1="945" y1="348" x2="590" y2="348" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
      <rect x="675.5" y="334" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="767.5" y="344" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">9. Return QR string / invoice_url</text><line x1="590" y1="376" x2="765" y2="376" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="585.5" y="362" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="677.5" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">10. INSERT payments (status=pending)</text><line x1="590" y1="404" x2="75" y2="404" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
      <rect x="240.5" y="390" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="332.5" y="400" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">11. Tampilkan QR / Invoice ke Customer</text><rect x="330" y="422" width="660" height="122" rx="6" fill="none" stroke="#D97706" stroke-width="1.5"/><rect x="330" y="422" width="165" height="18" fill="#D97706"/><text x="412" y="435" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Callback Webhook Asinkron</text><line x1="945" y1="456" x2="405" y2="456" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="583" y="442" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="675" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">12. POST /api/webhooks/xendit (x-callback-token)</text><line x1="405" y1="484" x2="590" y2="484" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="405.5" y="470" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="497.5" y="480" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">13. verifyWebhookSignature() + processWebhook()</text><line x1="590" y1="510" x2="765" y2="510" stroke="#0B192C" stroke-width="1.4"  marker-end="url(#arrow)"/>
      <rect x="585.5" y="496" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="677.5" y="506" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">14. Cek xendit_event_id unik -&gt; UPDATE paid</text><line x1="405" y1="534" x2="945" y2="534" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
      <rect x="583" y="520" width="184" height="13" fill="#FFFFFF" opacity="0.92"/>
      <text x="675" y="530" text-anchor="middle" font-size="9" font-weight="600" fill="#0B192C">15. HTTP 200 OK (idempoten)</text>
</svg>