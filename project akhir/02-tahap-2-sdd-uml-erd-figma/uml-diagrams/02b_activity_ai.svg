     <text x="900" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">5a. Query Langsung MySQL</text>
     <text x="900" y="263" text-anchor="middle" font-size="9" fill="#475569">AiDataQueryService (Role/Tenant Scoped)</text><path d="M654,325 L740,325 L740,252 L785,252" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="670" y="306" width="60" height="14" rx="3" fill="#FFFFFF"/><text x="700" y="316" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0E7490">Ya (KB/L1)</text><rect x="785" y="323" width="230" height="44" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="900" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">5b. Panggil OpenRouter API</text>
     <text x="900" y="356" text-anchor="middle" font-size="9" fill="#475569">OpenAiClient::chat(activeModel, tools)</text><path d="M600,350 L600,380 L760,380 L760,345 L785,345" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="650" y="361" width="60" height="14" rx="3" fill="#FFFFFF"/><text x="680" y="371" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0E7490">Layer 2/3 LLM</text><rect x="470" y="418" width="260" height="44" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="600" y="437" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">6. AiToolRegistry::execute()</text>
     <text x="600" y="451" text-anchor="middle" font-size="9" fill="#475569">Loop &lt;= max_tool_rounds + Policy + PII Mask</text><path d="M900,367 L900,440 L730,440" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="785" y="421" width="60" height="14" rx="3" fill="#FFFFFF"/><text x="815" y="431" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0E7490">Tool Calls</text><rect x="785" y="499" width="230" height="42" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="900" y="517" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">7. Persist History &amp; Usage</text>
     <text x="900" y="531" text-anchor="middle" font-size="9" fill="#475569">Simpan ai_messages + ai_usage_logs</text><path d="M600,462 L600,520 L785,520" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M1015,252 L1028,252 L1028,520 L1015,520" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="20" y="500" width="170" height="40" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="105" y="517" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">8. Render Jawaban AI</text>
     <text x="105" y="531" text-anchor="middle" font-size="9" fill="#475569">Jika API gagal -&gt; Fallback CS</text><path d="M785,540 L190,540" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="105" cy="566" r="8" fill="none" stroke="#0B192C" stroke-width="1.8"/><circle cx="105" cy="566" r="4.5" fill="#0B192C"/><path d="M105,540 L105,558" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/>
