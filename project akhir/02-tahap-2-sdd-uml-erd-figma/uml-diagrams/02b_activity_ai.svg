     <text x="325" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">2. Validasi Cookie &amp; Origin</text>
     <text x="325" y="113" text-anchor="middle" font-size="9" fill="#475569">Inject Sanctum Bearer (BFF)</text><path d="M190,102 L232,102" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="470" y="81" width="260" height="42" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="600" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">3. AiAssistantService::chat()</text>
     <text x="600" y="113" text-anchor="middle" font-size="9" fill="#475569">AiTextNormalizer + looksLikeInjection</text><path d="M418,102 L470,102" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><polygon points="600,153 649,178 600,203 551,178" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/>
     <text x="600" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">Guardrail /</text>
     <text x="600" y="188" text-anchor="middle" font-size="8.5" fill="#92400E">Injection?</text><path d="M600,123 L600,153" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="20" y="159" width="170" height="38" rx="10" fill="#FFF1F2" stroke="#DC2626" stroke-width="1.6"/>
     <text x="105" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Tolak Aman + cs@laundryku</text>
     <text x="105" y="189" text-anchor="middle" font-size="9" fill="#475569">Zero token &amp; zero kebocoran data</text><path d="M546,178 L190,178" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="340" y="159" width="60" height="14" rx="3" fill="#FFFFFF"/><text x="370" y="169" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0E7490">Blokir</text><rect x="470" y="232" width="260" height="40" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="600" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">4. Layer 1: AiIntentRouter</text>
     <text x="600" y="263" text-anchor="middle" font-size="9" fill="#475569">Cocokkan 21 Topik KB &amp; Query Data Lokal</text><path d="M600,203 L600,232" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="595" y="208" width="60" height="14" rx="3" fill="#FFFFFF"/><text x="625" y="218" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0E7490">Lolos</text><polygon points="600,300 649,325 600,350 551,325" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/>
