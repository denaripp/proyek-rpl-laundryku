  <rect x="0" y="0" width="210" height="585" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="0" y="0" width="210" height="34" fill="#0B192C"/><text x="105" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">User (4 Portal / Guest)</text><rect x="210" y="0" width="230" height="585" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="210" y="0" width="230" height="34" fill="#0B192C"/><text x="325" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Next.js BFF (/api/chat)</text><rect x="440" y="0" width="320" height="585" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><rect x="440" y="0" width="320" height="34" fill="#0B192C"/><text x="600" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Laravel AI Engine (LANDY)</text><rect x="760" y="0" width="280" height="585" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="760" y="0" width="280" height="34" fill="#0B192C"/><text x="900" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">MySQL DB &amp; OpenRouter API</text><circle cx="105" cy="58" r="9" fill="#0B192C"/><rect x="20" y="83" width="170" height="38" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
     <text x="105" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">1. Kirim Prompt ke Widget</text>
