ly="Consolas,monospace">+verifyWebhookSignature(...): bool</text><text x="318" y="357" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+processWebhook(data, type): void</text><text x="318" y="371" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+verifyCodPayment(...): bool</text></g><g><rect x="310" y="445" width="275" height="118" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="310" y="445" width="275" height="42" rx="3" fill="#0B192C"/><text x="447.5" y="460" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;model&gt;&gt;</text><text x="447.5" y="477" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Payment</text><line x1="310" y1="539" x2="585" y2="539" stroke="#0B192C" stroke-width="1.1"/><text x="318" y="501" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+id, order_id: bigint</text><text x="318" y="515" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+payment_method: online|cod</text><text x="318" y="529" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+amount, status, xendit_invoice_id</text><text x="318" y="553" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+events(): HasMany (PaymentEvent)</text></g><g><rect x="625" y="235" width="215" height="118" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="625" y="235" width="215" height="42" rx="3" fill="#0E7490"/><text x="732.5" y="250" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;service&gt;&gt; [SRP]</text><text x="732.5" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">CourierAssignmentService</text><line x1="625" y1="301" x2="840" y2="301" stroke="#0B192C" stroke-width="1.1"/><text x="633" y="291" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">-mapsService: GoogleMapsService</text><text x="633" y="315" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+assignCourier(order, type)</text><text x="633" y="329" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+findEligibleCouriers(order)</text><text x="633" y="343" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+handleRejection(task, reason)</text></g><g><rect x="625" y="435" width="215" height="118" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="625" y="435" width="215" height="42" rx="3" fill="#0B192C"/><text x="732.5" y="450" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;model&gt;&gt;</text><text x="732.5" y="467" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">CourierTask</text><line x1="625" y1="529" x2="840" y2="529" stroke="#0B192C" stroke-width="1.1"/><text x="633" y="491" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+id, order_id, courier_id</text><text x="633" y="505" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+task_type: pickup|delivery</text><text x="633" y="519" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+status: CourierTaskStatus</text><text x="633" y="543" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+gpsPoints(): HasMany</text></g><g><rect x="860" y="235" width="180" height="108" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="860" y="235" width="180" height="42" rx="3" fill="#0E7490"/><text x="950" y="250" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;service&gt;&gt; [SRP]</text><text x="950" y="267" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">SettlementService</text><line x1="860" y1="291" x2="1040" y2="291" stroke="#0B192C" stroke-width="1.1"/><text x="868" y="305" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+generateSettlement(store)</text><text x="868" y="319" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+verifySettlement(period)</text><text x="868" y="333" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+calculateCommission(...)</text></g><g><rect x="860" y="415" width="180" height="118" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="860" y="415" width="180" height="42" rx="3" fill="#0B192C"/><text x="950" y="430" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;model&gt;&gt;</text><text x="950" y="447" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">SettlementPeriod</text><line x1="860" y1="509" x2="1040" y2="509" stroke="#0B192C" stroke-width="1.1"/><text x="868" y="471" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+reference, store_id</text><text x="868" y="485" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+gross_amount, net_amount</text><text x="868" y="499" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">+status: generated|paid</text><text x="868" y="523" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+items(): HasMany</text></g><line x1="255" y1="88" x2="300" y2="88" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="277" y="81" text-anchor="middle" font-size="9" font-weight="700" fill="#0E7490">&lt;&lt;use&gt;&gt;</text><line x1="585" y1="88" x2="635" y2="88" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="610" y="81" text-anchor="middle" font-size="9" font-weight="700" fill="#0E7490">authorize</text><path d="M 585,180 L 610,180 L 610,214 L 848,214 L 848,132 L 860,132" fill="none" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="730" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#0E7490">transitions state</text><path d="M 350,196 L 350,214 L 145,214 L 145,235" fill="none" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="248" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#0E7490">manages (1..*)</text><path d="M 585,160 L 605,160 L 605,275 L 625,275" fill="none" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><line x1="145" y1="398" x2="145" y2="455" stroke="#0B192C" stroke-width="1.4" marker-start="url(#diamond-comp)" marker-end="url(#arrow)"/><text x="155" y="430" font-size="9" font-weight="700" fill="#0E7490">1  *--  1..*</text><path d="M 265,345 L 288,345 L 288,495 L 310,495" fill="none" stroke="#0B192C" stroke-width="1.4" marker-end="url(#arrow)"/><text x="288" y="425" text-anchor="middle" font-size="9" font-weight="700" fill="#0E7490" transform="rotate(-90,282,425)">1 -&gt; 0..1</text><line x1="447" y1="389" x2="447" y2="445" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="456" y="421" font-size="9" font-weight="700" fill="#0E7490">manages</text><line x1="732" y1="358" x2="732" y2="435" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="741" y="400" font-size="9" font-weight="700" fill="#0E7490">creates</text><line x1="950" y1="358" x2="950" y2="415" stroke="#0B192C" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="959" y="390" font-size="9" font-weight="700" fill="#0E7490">generates</text><rect x="25" y="592" width="1015" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/><text x="40" y="614" font-size="11" font-weight="800" fill="#0B192C">Penerapan SOLID pada Domain Inti LaundryKu:</text><text x="40" y="633" font-size="10" fill="#334155"><tspan font-weight="700" fill="#0E7490">[S] Single Responsibility:</tspan> Controller hanya memvalidasi request HTTP; logika transaksi terpisah ke OrderService, XenditService, CourierAssignmentService, SettlementService.</text><text x="40" y="650" font-size="10" fill="#334155"><tspan font-weight="700" fill="#0E7490">[O/L] Policy &amp; Transition Guard:</tspan> Otorisasi akses resource dipusatkan di 9 Policy (OrderPolicy, PaymentPolicy, StorePolicy, dll.), terpisah dari model Eloquent.</text><text x="40" y="667" font-size="10" fill="#334155"><tspan font-weight="700" fill="#0E7490">[D] Dependency Inversion:</tspan> Abstraksi driver eksternal (AI LLM, Notification Channels, Geocoding, OTP/WA) dijembatani interface di AppServiceProvider (lihat Diagram Class B).</text>
