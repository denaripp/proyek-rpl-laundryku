  <text x="530" y="24" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0B192C">Class Diagram Bagian A — Domain Marketplace, Order, Payment &amp; Policy (SRP &amp; Policy RBAC)</text><g><rect x="25" y="42" width="230" height="132" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="25" y="42" width="230" height="42" rx="3" fill="#0B192C"/><text x="140" y="57" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;controller&gt;&gt;</text><text x="140" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">OrderController</text><line x1="25" y1="108" x2="255" y2="108" stroke="#0B192C" stroke-width="1.1"/><text x="33" y="98" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">-orderService: OrderService</text><text x="33" y="122" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+store(req): JsonResponse</text><text x="33" y="136" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+show(order): JsonResponse</text><text x="33" y="150" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+updateWeight(req, order)</text><text x="33" y="164" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+cancel(req, order)</text></g><g><rect x="300" y="42" width="285" height="146" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="300" y="42" width="285" height="42" rx="3" fill="#0E7490"/><text x="442.5" y="57" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;service&gt;&gt; [SRP]</text><text x="442.5" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">OrderService</text><line x1="300" y1="108" x2="585" y2="108" stroke="#0B192C" stroke-width="1.1"/><text x="308" y="98" font-size="9.5" fill="#1E293B" font-family="Consolas,monospace">-assignment: CourierAssignmentService</text><text x="308" y="122" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+createOrder(data, customer): Order</text><text x="308" y="136" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+transition(order, status, actor): Order</text><text x="308" y="150" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+setActualWeight(order, kg, actor): Order</text><text x="308" y="164" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+recalculateFinalPrice(order): void</text><text x="308" y="178" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+cancel(order, actor, reason): Order</text></g><g><rect x="635" y="42" width="200" height="122" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="635" y="42" width="200" height="42" rx="3" fill="#155E75"/><text x="735" y="57" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;policy&gt;&gt;</text><text x="735" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">OrderPolicy</text><line x1="635" y1="98" x2="835" y2="98" stroke="#0B192C" stroke-width="1.1"/><text x="643" y="112" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+view(user, order): bool</text><text x="643" y="126" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+update(user, order): bool</text><text x="643" y="140" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+delete(user, order): bool</text><text x="643" y="154" font-size="9.5" fill="#0F172A" font-family="Consolas,monospace">+cancel(user, order): bool</text></g><g><rect x="860" y="42" width="180" height="146" rx="4" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.6"/><rect x="860" y="42" width="180" height="42" rx="3" fill="#334155"/><text x="950" y="57" text-anchor="middle" font-size="9.5" font-style="italic" fill="#99F6E4">&lt;&lt;enumeration&gt;&gt;</text><text x="950" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">OrderStatus</text><line x1="860" y1="164" x2="1040" y2="164" stroke="#0B192C" stroke