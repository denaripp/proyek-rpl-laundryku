  <text x="530" y="22" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0B192C">ERD Bagian B — Sub-Domain RBAC, Onboarding Toko, Komunikasi &amp; Tata Kelola</text><g><rect x="25" y="45" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="25" y="45" width="200" height="24" rx="3" fill="#0B192C"/><text x="125" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">roles</text><text x="32" y="83" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="32" y="97" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">UK name: varchar(50)</text><text x="32" y="111" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   display_name, is_system</text></g><g><rect x="25" y="165" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="25" y="165" width="200" height="24" rx="3" fill="#0B192C"/><text x="125" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">user_roles</text><text x="32" y="203" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="32" y="217" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK user_id, role_id</text><text x="32" y="231" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK store_id, assigned_by</text></g><g><rect x="25" y="285" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="25" y="285" width="200" height="24" rx="3" fill="#0B192C"/><text x="125" y="301" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">permissions</text><text x="32" y="323" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="32" y="337" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">UK name: varchar(100)</text><text x="32" y="351" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   category</text></g><g><rect x="25" y="395" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="25" y="395" width="200" height="24" rx="3" fill="#0B192C"/><text x="125" y="411" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">role_permissions</text><text x="32" y="433" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK (role_id, permission_id)</text><text x="32" y="447" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK role_id -&gt; roles</text><text x="32" y="461" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK permission_id</text></g><g><rect x="280" y="45" width="230" height="88" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="280" y="45" width="230" height="24" rx="3" fill="#0B192C"/><text x="395" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">otp_challenges</text><text x="287" y="83" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="287" y="97" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK user_id -&gt; users</text><text x="287" y="111" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   channel, destination_hash</text><text x="287" y="125" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   otp_hash (SHA-256), expires_at</text></g><g><rect x="280" y="175" width="230" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="280" y="175"