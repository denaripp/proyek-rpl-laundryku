olas,monospace">   message_type, body, read_at</text></g><g><rect x="565" y="45" width="230" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="565" y="45" width="230" height="24" rx="3" fill="#0B192C"/><text x="680" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">store_applications</text><text x="572" y="83" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="572" y="97" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK store_id, reviewed_by</text><text x="572" y="111" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   submitted_at, approved_at</text></g><g><rect x="565" y="165" width="230" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="565" y="165" width="230" height="24" rx="3" fill="#0B192C"/><text x="680" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">store_documents</text><text x="572" y="203" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="572" y="217" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK store_id, verified_by</text><text x="572" y="231" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   document_type, file_path</text></g><g><rect x="565" y="285" width="230" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="565" y="285" width="230" height="24" rx="3" fill="#0B192C"/><text x="680" y="301" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">store_payout_accounts</text><text x="572" y="323" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="572" y="337" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK store_id (UK)</text><text x="572" y="351" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   bank_code, account_number</text></g><g><rect x="565" y="405" width="230" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="565" y="405" width="230" height="24" rx="3" fill="#0B192C"/><text x="680" y="421" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">commission_settings</text><text x="572" y="443" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="572" y="457" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK store_id -&gt; stores</text><text x="572" y="471" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   commission_rate, fee_type</text></g><g><rect x="840" y="45" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="840" y="45" width="200" height="24" rx="3" fill="#0B192C"/><text x="940" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">notifications</text><text x="847" y="83" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">PK id: bigint</text><text x="847" y="97" font-size="8.8" font-weight="700" fill="#0E7490" font-family="Consolas,monospace">FK user_id -&gt; users</text><text x="847" y="111" font-size="8.8" font-weight="400" fill="#1E293B" font-family="Consolas,monospace">   type, title, delivered_via</text></g><g><rect x="840" y="165" width="200" height="74" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/><rect x="840" y="165" width="200" height="24" rx="3" fill="#0B192C"/><text x="940" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Consolas,monospace">whatsapp_logs<