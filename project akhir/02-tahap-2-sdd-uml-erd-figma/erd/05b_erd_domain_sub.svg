ne x1="125" y1="358" x2="125" y2="395" stroke="#475569" stroke-width="1.25" marker-start="url(#cf-one)" marker-end="url(#cf-many)"/><line x1="395" y1="370" x2="395" y2="410" stroke="#475569" stroke-width="1.25" marker-start="url(#cf-one)" marker-end="url(#cf-many)"/><line x1="680" y1="117" x2="680" y2="165" stroke="#475569" stroke-width="1.25" marker-start="url(#cf-one)" marker-end="url(#cf-many)"/><rect x="25" y="482" width="1015" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/><text x="532" y="500" text-anchor="middle" font-size="9.5" fill="#334155"><tspan font-weight="700" fill="#0B192C">Catatan Relasi Lintas Diagram:</tspan> user_id pada user_roles, otp_challenges, notifications, whatsapp_logs merujuk ke <tspan font-weight="700">users (ERD A)</tspan>; store_id pada store_applications, store_payout_accounts, commission_settings merujuk ke <tspan font-weight="700">stores (ERD A)</tspan>.</text>
